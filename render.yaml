services:
  - type: web
    name: radici-san-giovanni-lipioni
    runtime: static
    plan: free
    buildCommand: npm ci && npm run validate:places && npm run validate:publication-ready && npm run test:place-validation && npm test && npm run build
    staticPublishPath: ./dist/radici-san-giovanni-lipioni/browser
    headers:
      - path: /branding/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /assets/images/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /favicon.ico
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
